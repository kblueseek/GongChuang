# pid_tuner 配置：给哪个节点调什么参数、画哪条曲线，都在这里改，不用动代码。
#
# 换一个要调参的节点：改 node 和 params 就行（目标节点必须实现了
# add_on_set_parameters_callback，否则改了参数不会即时生效，只能靠重启）。
#
# params 每项：
#   name     目标节点的参数名（必须已在节点里 declare_parameter 过）
#   min/max  滑杆范围（超出自动夹紧）
#   step     滑杆步进
#   default  滑杆初始位置；如果目标节点已经在跑，启动时会读回真实值覆盖它
#            写整数默认值（如 10）就下发 INTEGER，写 10.0 就下发 DOUBLE
#            必须和节点里声明的类型一致，否则 set_parameters 会被拒

node: gimbal_track

params:
  # —— 水平（yaw 轴）——
  - {name: kp_yaw, min: 0.0, max: 6.0, step: 0.05, default: 1.5}
  - {name: ki_yaw, min: 0.0, max: 0.20, step: 0.001, default: 0.0}
  - {name: kd_yaw, min: 0.0, max: 1.0, step: 0.01, default: 0.05}

  # —— 竖直（extend 轴）——
  - {name: kp_extend, min: 0.0, max: 15.0, step: 0.1, default: 4.0}
  - {name: ki_extend, min: 0.0, max: 0.20, step: 0.001, default: 0.0}
  - {name: kd_extend, min: 0.0, max: 1.0, step: 0.01, default: 0.10}

  # —— 输出限幅 / 死区 ——
  - {name: max_yaw_deg_s, min: 24.0, max: 600.0, step: 6.0, default: 240.0}
  - {name: max_extend_deg_s, min: 60.0, max: 1200.0, step: 10.0, default: 600.0}
  - {name: deadband_px, min: 0.0, max: 80.0, step: 1.0, default: 10.0}

  # —— 下探（抓取）动作：目标静止后 lift 下降再抬起（位置闭环，保证回原位）——
  - {name: dip_depth, min: 0.0, max: 2000.0, step: 20.0, default: 1000.0}
  - {name: dip_down_vel_deg_s, min: 60.0, max: 1500.0, step: 20.0, default: 600.0}
  - {name: dip_up_vel_deg_s, min: 30.0, max: 800.0, step: 10.0, default: 250.0}
  - {name: dip_approach_deg, min: 0.0, max: 200.0, step: 5.0, default: 40.0}
  - {name: dip_creep_vel_deg_s, min: 10.0, max: 200.0, step: 10.0, default: 50.0}
  - {name: dip_dir, min: -1.0, max: 1.0, step: 2.0, default: 1.0}
  - {name: dip_still_px, min: 1.0, max: 40.0, step: 1.0, default: 8.0}
  - {name: dip_still_time_s, min: 0.1, max: 2.0, step: 0.05, default: 0.5}
  - {name: dip_cooldown_s, min: 0.0, max: 10.0, step: 0.5, default: 4.0}
  - {name: dip_center_confirm_s, min: 0.0, max: 1.5, step: 0.05, default: 0.3}

# 曲线段：把整个 plot 段删掉就只留滑杆（比如调底盘速度 PID 时没有像素可看）。
# 当前配的是 /material_target = [detected, cx, cy, img_w, img_h, color_id]：
#   目标 = 画面中心 (img_w/2, img_h/2)，实际 = 物料质心 (cx, cy)。
plot:
  topic: /material_target
  detected_index: 0
  x_index: 1
  y_index: 2
  width_index: 3
  height_index: 4
  window: 400        # 曲线上保留多少个采样点（30Hz 下 400 点约 13 秒）
  x_range: []        # 留空 = 按画面宽度自动；固定范围写成 [0, 1280]
  y_range: []        # 留空 = 按画面高度自动
