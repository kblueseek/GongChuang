# 这两行很重要，别删。
#
# 没有它们时，colcon 会把 console_scripts 装到 install/vision_node/bin/，
# 而 Lyrical 的 ros2 run / launch 只在 install/vision_node/lib/vision_node/ 里找，
# 于是报：libexec directory '.../lib/vision_node' does not exist。
# 加上以后可执行文件直接装进 lib/vision_node/，不需要再跑 scripts/mk_libexec.sh。
[develop]
script_dir=$base/lib/vision_node

[install]
install_scripts=$base/lib/vision_node
